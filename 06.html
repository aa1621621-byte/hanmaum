<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숲과 사람의 한마음 축제 — 시 낭송</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EDF1EF;
  --ink: #1B2B2C;
  --ink-soft: #5A6D6E;
  --water: #2F6466;
  --water-deep: #1E4547;
  --ring: #C9D6D4;
  --bloom: #B84C66;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #142122;
    --ink: #E8EEEC;
    --ink-soft: #97A9A8;
    --water: #7FB3B1;
    --water-deep: #A9D3D0;
    --ring: #2B3E3E;
    --bloom: #E37E95;
  }
}
:root[data-theme="dark"] {
  --paper: #142122;
  --ink: #E8EEEC;
  --ink-soft: #97A9A8;
  --water: #7FB3B1;
  --water-deep: #A9D3D0;
  --ring: #2B3E3E;
  --bloom: #E37E95;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Gowun Batang", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  min-height: 100dvh;
  padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
  text-align: center;
  -webkit-text-size-adjust: 100%;
}
.festival {
  font-size: 0.9rem;
  color: var(--ink-soft);
  letter-spacing: 0.02em;
  line-height: 1.6;
}
.festival b { font-weight: 700; color: var(--water); }
main {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  width: 100%;
  max-width: 420px;
}
h1 {
  font-weight: 700;
  font-size: clamp(1.7rem, 7.5vw, 2.3rem);
  line-height: 1.35;
  word-break: keep-all;
  color: var(--ink);
}
.reciter {
  font-size: 1.05rem;
  color: var(--ink-soft);
  margin-top: -14px;
}
.reciter span { color: var(--ink); }

/* play control */
.player {
  position: relative;
  width: 216px;
  height: 216px;
  margin-top: 6px;
}
.player svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.player circle { fill: none; stroke-width: 4; }
.track { stroke: var(--ring); }
.progress {
  stroke: var(--water);
  stroke-linecap: round;
  stroke-dasharray: 628;
  stroke-dashoffset: 628;
  transition: stroke-dashoffset 0.25s linear;
}
button {
  position: absolute;
  inset: 22px;
  border-radius: 50%;
  border: 0;
  background: var(--water);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease, background 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
button:active { transform: scale(0.96); }
button:focus-visible { outline: 3px solid var(--bloom); outline-offset: 4px; }
button svg { width: 64px; height: 64px; }
.playing button { background: var(--water-deep); }
/* water ripple while playing */
.ripple {
  position: absolute; inset: 22px; border-radius: 50%;
  border: 2px solid var(--water);
  opacity: 0; pointer-events: none;
}
.playing .ripple { animation: ripple 2.4s ease-out infinite; }
.playing .ripple.r2 { animation-delay: 1.2s; }
@keyframes ripple {
  0%   { transform: scale(1);   opacity: 0.5; }
  100% { transform: scale(1.32); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .playing .ripple { animation: none; } }

.time {
  font-variant-numeric: tabular-nums;
  font-size: 1rem;
  color: var(--ink-soft);
  margin-top: -6px;
}
.hint {
  font-size: 0.95rem;
  color: var(--ink-soft);
  min-height: 1.4em;
}
footer {
  font-size: 0.8rem;
  color: var(--ink-soft);
  line-height: 1.6;
}
</style>
</head>
<body>
<p class="festival">제5회 고덕2동 한마음 축제<br><b>고덕천을 한강으로</b></p>

  <p class="reciter">낭송 <span>김춘화</span></p>

  <div class="player" id="player">

<script>
(function () {
  var audio = document.getElementById('audio');
  var btn = document.getElementById('btn');
  var player = document.getElementById('player');
  var prog = document.getElementById('progress');
  var time = document.getElementById('time');
  var hint = document.getElementById('hint');
  var iPlay = document.getElementById('iconPlay');
  var iPause = document.getElementById('iconPause');
  var CIRC = 628;

  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    s = Math.floor(s);
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function setState(playing) {
    player.classList.toggle('playing', playing);
    iPlay.style.display = playing ? 'none' : '';
    iPause.style.display = playing ? '' : 'none';
    btn.setAttribute('aria-label', playing ? '일시정지' : '낭송 듣기');
    hint.textContent = playing ? '낭송 중입니다' : (audio.currentTime > 0 && !audio.ended ? '다시 누르면 이어서 재생됩니다' : '버튼을 누르면 낭송이 시작됩니다');
  }
  function tick() {
    var d = audio.duration || 0, c = audio.currentTime || 0;
    time.textContent = fmt(c) + ' / ' + fmt(d);
    prog.style.strokeDashoffset = d ? CIRC * (1 - c / d) : CIRC;
  }

  btn.addEventListener('click', function () {
    if (audio.paused) { audio.play().catch(function(){}); } else { audio.pause(); }
  });
  audio.addEventListener('play', function () { setState(true); });
  audio.addEventListener('pause', function () { setState(false); });
  audio.addEventListener('ended', function () {
    setState(false);
    hint.textContent = '낭송이 끝났습니다. 다시 들으시려면 버튼을 눌러 주세요';
    prog.style.strokeDashoffset = 0;
  });
  audio.addEventListener('timeupdate', tick);
  audio.addEventListener('loadedmetadata', tick);
  audio.addEventListener('durationchange', tick);

  // Try to start automatically; most phones block this until a tap, and that's fine.
  var p = audio.play();
  if (p && p.catch) { p.catch(function () { setState(false); }); }
})();
</script>
</body>
</html>
